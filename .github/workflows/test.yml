name: Test and package
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run --frozen --extra dev pytest
      - run: uv run --frozen --extra dev python scripts/package_skill.py
      - run: uv run --frozen --extra dev python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: mcplaya-distribution
          path: dist/*
