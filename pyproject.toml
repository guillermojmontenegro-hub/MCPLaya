[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcplaya"
version = "0.1.0"
description = "Laya MCP decision delegation with durable observe-decide-act sequences"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "third_party/*"]
authors = [{name = "Guillermo Montenegro"}]
dependencies = ["laya[mcp]==0.3.20"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
mcplaya = "mcplaya.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
